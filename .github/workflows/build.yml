name: Build Executables

on:
  # Build on version tags
  push:
    tags:
      - 'v*'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            artifact: wxdxx-macos-arm64
          - os: macos-15-intel
            name: macos-x64
            artifact: wxdxx-macos-x64
          - os: ubuntu-latest
            name: linux-x64
            artifact: wxdxx-linux-x64
          # Note: linux-arm64 requires public repo or GitHub Team/Enterprise
          # - os: ubuntu-24.04-arm
          #   name: linux-arm64
          #   artifact: wxdxx-linux-arm64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build executable
        run: |
          pyinstaller --onefile --name wxdxx src/wxdxx/app.py

      - name: Make executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x dist/wxdxx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/wxdxx
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          # Rename each artifact to include platform suffix
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            cp "$dir/wxdxx" "release/$name"
          done
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
