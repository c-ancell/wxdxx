[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spc-dash"
version = "0.1.0"
description = "A TUI for reviewing Storm Prediction Center products and WFO text products"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Colton Ancell" }
]
keywords = ["weather", "spc", "tui", "terminal", "severe-weather"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "textual>=0.40.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
spc-dash = "spc_dash.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spc_dash"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
